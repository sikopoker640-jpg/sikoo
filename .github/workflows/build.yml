name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir project
          for z in *.zip; do unzip -o "$z" -d project; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GameCleaner-apk
          path: "project/**/build/outputs/apk/debug/*.apk"
